<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TT Core Machine V4 | Pioneer Mining</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 25%,#173b58 0%,#07131f 38%,#02060b 75%);
  overflow-x:hidden;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,220,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,220,255,.035) 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

/* HEADER */
.header{
  position:relative;
  z-index:5;
  width:100%;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(0,220,255,.25);
  background:rgba(2,8,15,.82);
  backdrop-filter:blur(12px);
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  color:#7deaff;
  text-shadow:0 0 15px #00cfff;
}

.pioneer{
  font-size:13px;
  color:#b8d8e5;
}

.pioneer span{
  color:#6dffbb;
  font-weight:bold;
}

/* MAIN */
.main{
  position:relative;
  z-index:2;
  max-width:900px;
  margin:auto;
  padding:20px 15px 110px;
}

/* STATUS */
.status{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
}

.status-box{
  padding:9px 18px;
  border:1px solid rgba(73,255,190,.45);
  border-radius:30px;
  background:rgba(0,40,30,.35);
  color:#72ffbd;
  font-size:12px;
  letter-spacing:1px;
  box-shadow:0 0 20px rgba(0,255,170,.1);
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#50ffad;
  box-shadow:0 0 12px #50ffad;
  margin-right:7px;
}

/* CORE AREA */
.core-section{
  position:relative;
  min-height:470px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.core-glow{
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;
  background:rgba(0,210,255,.13);
  filter:blur(45px);
  animation:pulse 3s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{transform:scale(.9);opacity:.55}
  50%{transform:scale(1.12);opacity:1}
}

/* CORE MACHINE */
.core-machine{
  position:relative;
  width:300px;
  height:300px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 50%,
      #d9fbff 0%,
      #65eaff 8%,
      #087da7 22%,
      #092d46 43%,
      #06101a 64%,
      #02070c 75%);
  border:7px solid #12394f;
  box-shadow:
    0 0 20px #00d9ff,
    0 0 60px rgba(0,214,255,.7),
    inset 0 0 45px rgba(0,213,255,.8);
  animation:coreFloat 4s infinite ease-in-out;
}

@keyframes coreFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

/* OUTER RINGS */
.core-machine::before,
.core-machine::after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(0,222,255,.7);
}

.core-machine::before{
  inset:-24px;
  border-top-color:#65ffdc;
  border-bottom-color:#1479a5;
  animation:spin 8s linear infinite;
}

.core-machine::after{
  inset:-43px;
  border-left-color:#00d9ff;
  border-right-color:#00d9ff;
  opacity:.45;
  animation:spinReverse 14s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}

.core-center{
  text-align:center;
  z-index:2;
}

.core-title{
  font-size:34px;
  font-weight:900;
  letter-spacing:3px;
  color:#fff;
  text-shadow:
    0 0 8px #fff,
    0 0 25px #00d9ff;
}

.core-v4{
  margin-top:5px;
  font-size:13px;
  color:#6df4ff;
  letter-spacing:5px;
}

.mining-rate{
  margin-top:18px;
  font-size:14px;
  color:#9eeeff;
}

.rate{
  font-size:29px;
  font-weight:900;
  color:#fff;
  text-shadow:0 0 15px #00eaff;
}

/* INFO CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:15px;
}

.stat{
  padding:16px 10px;
  text-align:center;
  border:1px solid rgba(0,210,255,.22);
  border-radius:15px;
  background:rgba(5,22,34,.75);
  box-shadow:inset 0 0 25px rgba(0,170,255,.04);
}

.stat-label{
  color:#7898a8;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.stat-value{
  margin-top:7px;
  font-size:18px;
  font-weight:bold;
  color:#eaffff;
}

.green{
  color:#6dffbb;
}

/* ACTION */
.mine-area{
  margin-top:18px;
  text-align:center;
}

.mine-button{
  border:1px solid #57edff;
  border-radius:15px;
  padding:14px 40px;
  background:linear-gradient(135deg,#063c58,#087b9b);
  color:#fff;
  font-weight:900;
  letter-spacing:2px;
  box-shadow:0 0 25px rgba(0,215,255,.3);
  cursor:pointer;
}

.mine-button:active{
  transform:scale(.96);
}

.message{
  min-height:18px;
  margin-top:9px;
  color:#79b9c9;
  font-size:11px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
  background:rgba(1,7,13,.94);
  border-top:1px solid rgba(0,210,255,.3);
  backdrop-filter:blur(15px);
}

.nav-btn{
  border:0;
  background:transparent;
  color:#72909c;
  min-height:55px;
  cursor:pointer;
  font-size:10px;
}

.nav-icon{
  display:block;
  font-size:21px;
  margin-bottom:4px;
  filter:drop-shadow(0 0 5px rgba(0,210,255,.35));
}

.nav-btn.active{
  color:#6feaff;
}

.nav-btn.active .nav-icon{
  filter:drop-shadow(0 0 9px #00d9ff);
}

/* MOBILE */
@media(max-width:600px){

  .header{
    padding:13px 12px;
  }

  .logo{
    font-size:15px;
  }

  .pioneer{
    font-size:11px;
  }

  .main{
    padding-top:15px;
  }

  .core-section{
    min-height:390px;
  }

  .core-machine{
    width:220px;
    height:220px;
  }

  .core-machine::before{
    inset:-17px;
  }

  .core-machine::after{
    inset:-31px;
  }

  .core-title{
    font-size:25px;
  }

  .core-v4{
    font-size:10px;
    letter-spacing:3px;
  }

  .rate{
    font-size:23px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:12px 5px;
  }

  .stat-value{
    font-size:14px;
  }

  .bottom-nav{
    padding-left:2px;
    padding-right:2px;
  }

  .nav-btn{
    font-size:8px;
  }

  .nav-icon{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">⚡ TT CORE</div>

  <div class="pioneer">
    Pioneer: <span id="username">Guest</span>
  </div>
</header>

<main class="main">

  <div class="status">
    <div class="status-box">
      <span class="dot"></span>
      CORE ONLINE • MINING ACTIVE
    </div>
  </div>

  <section class="core-section">

    <div class="core-glow"></div>

    <div class="core-machine">

      <div class="core-center">

        <div class="core-title">TT CORE</div>

        <div class="core-v4">
          MACHINE V4
        </div>

        <div class="mining-rate">
          Mining Rate
        </div>

        <div class="rate">
          <span id="rate">0.25</span> TT/H
        </div>

      </div>

    </div>

  </section>

  <section class="stats">

    <div class="stat">
      <div class="stat-label">Balance</div>
      <div class="stat-value">
        <span id="balance">0.0000</span> TT
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Session</div>
      <div class="stat-value green" id="session">
        00:00:00
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Status</div>
      <div class="stat-value green">
        ACTIVE
      </div>
    </div>

  </section>

  <div class="mine-area">

    <button class="mine-button" onclick="startMining()">
      ⛏️ START MINING
    </button>

    <div class="message" id="message">
      TT Core Machine V4 ready.
    </div>

  </div>

</main>

<nav class="bottom-nav">

  <button class="nav-btn active" onclick="openPage('Mining')">
    <span class="nav-icon">⛏️</span>
    Mining
  </button>

  <button class="nav-btn" onclick="openPage('Wallet')">
    <span class="nav-icon">💳</span>
    Wallet
  </button>

  <button class="nav-btn" onclick="openPage('Referral')">
    <span class="nav-icon">👥</span>
    Referral
  </button>

  <button class="nav-btn" onclick="openPage('Chat')">
    <span class="nav-icon">💬</span>
    Chat
  </button>

  <button class="nav-btn" onclick="openPage('Profile')">
    <span class="nav-icon">👤</span>
    Profile
  </button>

  <button class="nav-btn" onclick="openPage('Reward')">
    <span class="nav-icon">🎁</span>
    Reward
  </button>

  <button class="nav-btn" onclick="openPage('Marketplace')">
    <span class="nav-icon">🛒</span>
    Market
  </button>

</nav>

<script>

/* =========================
   PIONEER USER
========================= */

const savedUser =
  localStorage.getItem("piUser") ||
  localStorage.getItem("username");

if(savedUser){
  document.getElementById("username").textContent = savedUser;
}


/* =========================
   DEMO MINING DISPLAY
   DOES NOT MODIFY BACKEND
========================= */

let mining = false;
let balance = 0;
let seconds = 0;
let timer = null;

function startMining(){

  if(mining){
    document.getElementById("message").textContent =
      "⛏️ Mining session already active.";
    return;
  }

  mining = true;

  document.getElementById("message").textContent =
    "⚡ TT Core Machine V4 mining session started.";

  timer = setInterval(function(){

    seconds++;

    const h =
      String(Math.floor(seconds / 3600)).padStart(2,"0");

    const m =
      String(Math.floor((seconds % 3600) / 60)).padStart(2,"0");

    const s =
      String(seconds % 60).padStart(2,"0");

    document.getElementById("session").textContent =
      `${h}:${m}:${s}`;

    balance += 0.25 / 3600;

    document.getElementById("balance").textContent =
      balance.toFixed(4);

  },1000);
}


/* =========================
   NAVIGATION PLACEHOLDER
========================= */

function openPage(page){

  document.getElementById("message").textContent =
    page + " module selected.";

  /*
   * Dito natin ikakabit sa actual:
   * wallet.html
   * referral.html
   * chat.html
   * profile.html
   * reward.html
   * marketplace.html
   *
   * kapag ready na ang bawat module.
   */
}

</script>

</body>
</html>
