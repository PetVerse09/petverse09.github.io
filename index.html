<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ET Token</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #4b087d 0%, #180025 45%, #09000f 100%);
      color: #fff;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,.15);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      color: #3a1450;
      background: linear-gradient(145deg, #fff3a0, #d4a72c, #fff0a0);
      box-shadow: 0 0 25px rgba(255,215,0,.45);
    }

    header h1 {
      margin-top: 12px;
      color: #ffd84d;
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
      opacity: .75;
    }

    main {
      width: 92%;
      max-width: 600px;
      margin: 25px auto;
    }

    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
    }

    .card h2 {
      color: #ffd84d;
      margin-bottom: 15px;
    }

    .balance {
      text-align: center;
    }

    .balance-value {
      font-size: 42px;
      font-weight: bold;
      color: #ffd84d;
      margin: 10px 0;
    }

    .symbol {
      font-size: 18px;
      opacity: .8;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      padding: 15px;
      border-radius: 14px;
      background: rgba(0,0,0,.22);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      color: #ffd84d;
      margin-top: 7px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: #26002f;
      background: linear-gradient(135deg, #ffe66d, #d6a928);
      margin-top: 10px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .login {
      text-align: center;
    }

    .username {
      text-align: center;
      font-size: 20px;
      color: #ffd84d;
      margin-bottom: 10px;
    }

    .mining-status {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.2);
      margin-bottom: 10px;
    }

    .rate {
      text-align: center;
      font-size: 20px;
      margin: 15px 0;
    }

    .rate span {
      color: #ffd84d;
      font-weight: bold;
    }

    .referral-code {
      padding: 14px;
      text-align: center;
      border: 1px dashed rgba(255,216,77,.5);
      border-radius: 10px;
      color: #ffd84d;
      font-weight: bold;
      word-break: break-all;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      min-height: 20px;
      color: #ffd84d;
    }

    footer {
      text-align: center;
      padding: 25px;
      opacity: .55;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ET</div>
  <h1>ET Token</h1>
  <p>Earn • Build • Grow</p>
</header>

<main>

  <!-- LOGIN -->
  <section class="card login" id="loginSection">
    <h2>Welcome to ET Token</h2>
    <p>Connect your Pi account to continue.</p>

    <button id="loginBtn" onclick="loginWithPi()">
      Login with Pi
    </button>
  </section>

  <!-- PROFILE -->
  <section class="card" id="profileSection" style="display:none;">
    <div class="username" id="username">Loading...</div>

    <div class="stats">
      <div class="stat">
        Reputation
        <strong id="reputation">0</strong>
      </div>

      <div class="stat">
        Multiplier
        <strong id="multiplier">1.00x</strong>
      </div>
    </div>
  </section>

  <!-- BALANCE -->
  <section class="card balance" id="balanceSection" style="display:none;">
    <h2>ET Balance</h2>

    <div class="balance-value" id="balance">
      0.00000000
    </div>

    <div class="symbol">ET</div>
  </section>

  <!-- MINING -->
  <section class="card" id="miningSection" style="display:none;">
    <h2>ET Mining</h2>

    <div class="mining-status" id="miningStatus">
      Mining is not active
    </div>

    <div class="rate">
      Current Rate:
      <span id="miningRate">0.01 ET/hour</span>
    </div>

    <button id="startMiningBtn" onclick="startMining()">
      Start 24-Hour Mining
    </button>

    <button id="claimBtn"
            onclick="claimMining()"
            style="display:none;">
      Claim ET
    </button>
  </section>

  <!-- REFERRAL -->
  <section class="card" id="referralSection" style="display:none;">
    <h2>Referral</h2>

    <p style="margin-bottom:12px;">
      Your ET referral code is your Pi username.
    </p>

    <div class="referral-code" id="referralCode">
      —
    </div>

    <button onclick="copyReferral()">
      Copy Referral Code
    </button>
  </section>

  <div id="message"></div>

</main>

<footer>
  ET Token © 2026
</footer>


<script>

  /*
    ================================
       ET TOKEN FRONTEND CONFIG
    ================================
  */

  const BACKEND_URL = "";

  let piAccessToken = null;
  let currentUser = null;


  /*
    ================================
       PI INITIALIZATION
    ================================
  */

  try {
    Pi.init({
      version: "2.0",
      sandbox: true
    });
  } catch (error) {
    console.error("Pi SDK initialization error:", error);
  }


  /*
    ================================
       MESSAGE
    ================================
  */

  function showMessage(text) {
    document.getElementById("message").textContent = text;
  }


  /*
    ================================
       PI LOGIN
    ================================
  */

  async function loginWithPi() {

    const button = document.getElementById("loginBtn");

    try {

      button.disabled = true;
      button.textContent = "Connecting...";

      showMessage("Connecting to Pi...");

      const authResult = await Pi.authenticate(
        ["username"],
        function(payment) {
          console.log("Incomplete payment:", payment);
        }
      );

      piAccessToken = authResult.accessToken;

      const response = await fetch(
        BACKEND_URL + "/api/auth/pi",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            accessToken: piAccessToken
          })
        }
      );

      if (!response.ok) {
        throw new Error("ET authentication failed.");
      }

      const data = await response.json();

      currentUser = data;

      document.getElementById("loginSection").style.display = "none";
      document.getElementById("profileSection").style.display = "block";
      document.getElementById("balanceSection").style.display = "block";
      document.getElementById("miningSection").style.display = "block";
      document.getElementById("referralSection").style.display = "block";

      document.getElementById("username").textContent =
        "@" + data.username;

      document.getElementById("referralCode").textContent =
        data.referralCode || data.username;

      showMessage("Pi login successful.");

      await loadProfile();
      await loadBalance();
      await loadMiningStatus();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message || "Pi login failed."
      );

      button.disabled = false;
      button.textContent = "Login with Pi";
    }
  }


  /*
    ================================
       API HELPER
    ================================
  */

  async function apiRequest(endpoint, method = "POST") {

    const response = await fetch(
      BACKEND_URL + endpoint,
      {
        method: method,
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          accessToken: piAccessToken
        })
      }
    );

    if (!response.ok) {
      throw new Error("Request failed.");
    }

    return await response.json();
  }


  /*
    ================================
       PROFILE
    ================================
  */

  async function loadProfile() {

    try {

      const data = await apiRequest(
        "/api/profile"
      );

      document.getElementById("username").textContent =
        "@" + data.username;

      document.getElementById("reputation").textContent =
        data.reputationScore ?? 0;

      document.getElementById("multiplier").textContent =
        (data.reputationMultiplier ?? 1).toFixed(2) + "x";

      document.getElementById("referralCode").textContent =
        data.referralCode || data.username;

    } catch (error) {

      console.error("Profile error:", error);

    }
  }


  /*
    ================================
       BALANCE
    ================================
  */

  async function loadBalance() {

    try {

      const data = await apiRequest(
        "/api/balance"
      );

      document.getElementById("balance").textContent =
        Number(data.balance || 0).toFixed(8);

    } catch (error) {

      console.error("Balance error:", error);

    }
  }


  /*
    ================================
       START MINING
    ================================
  */

  async function startMining() {

    const button =
      document.getElementById("startMiningBtn");

    try {

      button.disabled = true;

      showMessage("Starting ET mining...");

      const data = await apiRequest(
        "/api/mining/start"
      );

      document.getElementById("miningStatus").textContent =
        "Mining active until " +
        new Date(data.endsAt).toLocaleString();

      document.getElementById("miningRate").textContent =
        Number(data.rate).toFixed(8) +
        " ET/hour";

      showMessage(
        "ET mining started successfully."
      );

      await loadMiningStatus();

    } catch (error) {

      showMessage(
        error.message || "Unable to start mining."
      );

      button.disabled = false;
    }
  }


  /*
    ================================
       MINING STATUS
    ================================
  */

  async function loadMiningStatus() {

    try {

      const data = await apiRequest(
        "/api/mining/status"
      );

      const status =
        document.getElementById("miningStatus");

      const startButton =
        document.getElementById("startMiningBtn");

      const claimButton =
        document.getElementById("claimBtn");

      if (!data.active) {

        status.textContent =
          "Mining is not active";

        startButton.style.display = "block";
        startButton.disabled = false;

        claimButton.style.display = "none";

        return;
      }

      status.textContent =
        "Mining ends: " +
        new Date(data.endsAt).toLocaleString();

      document.getElementById("miningRate").textContent =
        Number(data.rate).toFixed(8) +
        " ET/hour";

      startButton.disabled = true;

      if (data.claimAvailable) {

        claimButton.style.display = "block";
        claimButton.disabled = false;

        status.textContent =
          "Mining complete — ET is ready to claim.";

      } else {

        claimButton.style.display = "none";
      }

    } catch (error) {

      console.error(
        "Mining status error:",
        error
      );
    }
  }


  /*
    ================================
       CLAIM MINING
    ================================
  */

  async function claimMining() {

    const button =
      document.getElementById("claimBtn");

    try {

      button.disabled = true;

      showMessage("Claiming ET...");

      const data = await apiRequest(
        "/api/mining/claim"
      );

      showMessage(
        "Claim successful: " +
        Number(data.amount).toFixed(8) +
        " ET"
      );

      await loadBalance();
      await loadProfile();
      await loadMiningStatus();

    } catch (error) {

      showMessage(
        error.message || "Claim failed."
      );

      button.disabled = false;
    }
  }


  /*
    ================================
       COPY REFERRAL
    ================================
  */

  async function copyReferral() {

    const code =
      document.getElementById("referralCode").textContent;

    try {

      await navigator.clipboard.writeText(code);

      showMessage(
        "Referral code copied."
      );

    } catch (error) {

      showMessage(
        "Unable to copy referral code."
      );
    }
  }


  /*
    ================================
       AUTO REFRESH
    ================================
  */

  setInterval(async function() {

    if (!piAccessToken) return;

    await loadMiningStatus();

  }, 30000);

</script>

</body>
</html>
